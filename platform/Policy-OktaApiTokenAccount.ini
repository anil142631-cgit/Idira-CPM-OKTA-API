;----------------------------------------------------------------------------
; File    : Policy-OktaApiTokenAccount.ini
; Purpose : CPM platform definition for the Okta API TOKEN ACCOUNT itself (.NET plugin, OktaObjectType=ApiToken)
; Author  : Anilkumar Dadi | Anilkumar.Dadi@cyderes.com | Cyderes
; Version : 1.0
; Date    : 15-Sep-2026
;----------------------------------------------------------------------------
;=====================================================================================
; Okta API Token Account (.NET plugin) - the account that holds the Okta API token used by the Okta users platform
; Plugin: OktaApiTokenPlugin.dll - Verify = keep-alive (GET /users/me); Change only via "specify next password" (validates the
; new token, revokes the old one); Reconcile impossible (Okta cannot create tokens by API).
; Import with Policy-OktaApiTokenAccount.xml (Platform Management > Import).
; If your PAS version rejects any key here, export an existing .NET-based platform (e.g. the
; Sample REST API platform) from the same environment and merge these values into it.
;=====================================================================================
PolicyID=OktaApiTokenAccount
PolicyName=Okta API Token Account - NET plugin
PolicyType=regular
ImmediateInterval=5
Interval=1440
MaxConcurrentConnections=3
AllowedSafes=.*
MinValidityPeriod=60
ResetOveridesMinValidity=Yes
ResetOveridesTimeFrame=Yes
Timeout=30
UnlockIfFail=No
; plugin return codes that must not be retried (see OktaRc.cs)
UnrecoverableErrors=8403,8450,8451,8452,8453,8460
MaximumRetries=5
MinDelayBetweenRetries=90
; ---- plugin binding ----
ExeName=CANetPluginInvoker.exe
DllName=OktaApiTokenPlugin.dll
; Plugin identity - the CPM loads the DLL from bin\<PluginId>\<PluginVersion>\
PluginName=Okta Users via API Token
PluginId=OktaUsersApiToken
PluginVersion=1.0.0
XMLFile=Yes
; ---- change ----
AllowManualChange=Yes
PerformPeriodicChange=No
HeadStartInterval=5
FromHour=-1
ToHour=-1
ChangeNotificationPeriod=-1
DaysNotifyPriorExpiration=7
; ---- verify ----
VFAllowManualVerification=Yes
VFPerformPeriodicVerification=Yes
VFVerificationPeriod=7
VFFromHour=-1
VFToHour=-1
; ---- reconcile ----
RCAllowManualReconciliation=No
RCAutomaticReconcileWhenUnsynched=No
; 8413 = the stored password is wrong (strict verify, or E0000014 'Old Password is not correct') - reconcile it
RCReconcileReasons=
RCFromHour=-1
RCToHour=-1
; ---- password policy: mirror the Okta password policy of the target group ----
PasswordLength=24
MinUpperCase=2
MinLowerCase=2
MinDigit=2
MinSpecial=2
PasswordForbiddenChars=
PasswordLevelRequestTimeout=5
; ---- plugin settings (read by the plugin from the platform's extrainfo) ----
; Yes = verify also authenticates as the target via /api/v1/authn (detects a wrong stored password; counts as a sign-in)
OktaObjectType=ApiToken
HttpTimeoutSeconds=30
Debug=No
