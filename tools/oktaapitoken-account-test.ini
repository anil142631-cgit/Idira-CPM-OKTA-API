; File    : oktaapitoken-account-test.ini
; Purpose : Parameters file for running the TOKEN ACCOUNT platform logic manually with CANetPluginInvoker (test only)
; Author  : Anilkumar Dadi | Anilkumar.Dadi@cyderes.com | Cyderes
; Version : 1.0
; Date    : 15-Sep-2026
;----------------------------------------------------------------------------
; Run from the CPM bin folder with the FULL path to the DLL:
;   cd "C:\Program Files (x86)\CyberArk\Password Manager\bin"
;   $dll = "C:\Program Files (x86)\CyberArk\Password Manager\bin\OktaApiTokenPlugin.dll"
;   .\CANetPluginInvoker.exe oktaapitoken-account-test.ini verifypass $dll True      # RC 0: token valid (keep-alive)
;   .\CANetPluginInvoker.exe oktaapitoken-account-test.ini changepass $dll True      # RC 0: new token proven, old one revoked
;   .\CANetPluginInvoker.exe oktaapitoken-account-test.ini reconcilepass $dll True   # RC 8452: reconcile impossible for tokens
; Delete this file afterwards - it holds two API tokens.

[targetaccount]
; the token account: Username = the Okta service administrator that owns the token
username=svc-cyberark@lab.test
; the CURRENT Okta API token (what the vault holds today)
password=00XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
; the NEXT token, created in the Okta Admin Console as the same administrator (used by changepass)
newpassword=00YYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYYY
Address=integrator-3537434.okta.com
safename=Okta-API-Tokens
foldername=Root
objectname=OktaApiTokenAccount-test
PolicyID=OktaApiTokenAccount

[extrainfo]
OktaObjectType=ApiToken
HttpTimeoutSeconds=30
Debug=Yes
